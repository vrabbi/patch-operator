# Namespace-only install.
#
# Omits the cluster-scoped CRDs entirely, so cross-namespace contribution is not merely denied but
# absent -- there is no API to express it. The operator then needs no cluster-wide write RBAC, and
# the strongest control in the design (a ResourcePatch cannot reach outside its namespace) holds by
# construction rather than by policy.
#
# Use this when no shared object is ever contributed to from outside its own namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: patch-operator-system
namePrefix: patch-operator-
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: patch-operator
configurations:
  - kustomizeconfig.yaml

resources:
  - ../../rbac
  - ../../manager
  - ../../webhook
  - ../../cert
  - crd
patches:
  - path: webhook_cainjection_patch.yaml
    target:
      kind: ValidatingWebhookConfiguration
  - path: webhook_cainjection_mutating_patch.yaml
    target:
      kind: MutatingWebhookConfiguration
  # Drop the ClusterResourcePatch webhooks: the kind does not exist in this install.
  - path: webhook_namespaced_only_patch.yaml
    target:
      kind: ValidatingWebhookConfiguration
  - path: webhook_namespaced_only_patch.yaml
    target:
      kind: MutatingWebhookConfiguration
  # Narrow the operator's own RBAC to match. A strategic merge, so it needs no target selector:
  # kustomize matches on the patch's own kind and name.
  - path: role_namespaced_only_patch.yaml
  # And remove the tenant role for the kind this install does not have.
  - path: tenant_role_namespaced_only_patch.yaml
replacements:
  - source:
      kind: Certificate
      group: cert-manager.io
      version: v1
      name: serving-cert
      fieldPath: .metadata.namespace
    targets:
      - select:
          kind: ValidatingWebhookConfiguration
        fieldPaths:
          - .metadata.annotations.[cert-manager.io/inject-ca-from]
        options: { delimiter: /, index: 0, create: true }
      - select:
          kind: MutatingWebhookConfiguration
        fieldPaths:
          - .metadata.annotations.[cert-manager.io/inject-ca-from]
        options: { delimiter: /, index: 0, create: true }
  - source:
      kind: Certificate
      group: cert-manager.io
      version: v1
      name: serving-cert
      fieldPath: .metadata.name
    targets:
      - select:
          kind: ValidatingWebhookConfiguration
        fieldPaths:
          - .metadata.annotations.[cert-manager.io/inject-ca-from]
        options: { delimiter: /, index: 1, create: true }
      - select:
          kind: MutatingWebhookConfiguration
        fieldPaths:
          - .metadata.annotations.[cert-manager.io/inject-ca-from]
        options: { delimiter: /, index: 1, create: true }
