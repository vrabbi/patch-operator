apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: patch-operator-system
namePrefix: patch-operator-
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: patch-operator
resources:
  - ../crd
  - ../rbac
  - ../manager
  - ../webhook
  - ../cert
patches:
  - path: webhook_cainjection_patch.yaml
    target:
      kind: ValidatingWebhookConfiguration
replacements:
  # Point the webhook's CA bundle at the certificate the operator serves with.
  - source:
      kind: Certificate
      group: cert-manager.io
      version: v1
      name: serving-cert
      fieldPath: .metadata.namespace
    targets:
      - select:
          kind: ValidatingWebhookConfiguration
        fieldPaths:
          - .metadata.annotations.[cert-manager.io/inject-ca-from]
        options:
          delimiter: /
          index: 0
          create: true
  - source:
      kind: Certificate
      group: cert-manager.io
      version: v1
      name: serving-cert
      fieldPath: .metadata.name
    targets:
      - select:
          kind: ValidatingWebhookConfiguration
        fieldPaths:
          - .metadata.annotations.[cert-manager.io/inject-ca-from]
        options:
          delimiter: /
          index: 1
          create: true
