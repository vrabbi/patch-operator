name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Built from source via the Makefile rather than using the prebuilt action binary.
      # golangci-lint refuses to analyse a module whose go directive is newer than the Go version
      # golangci-lint was itself compiled with, so the pinned-toolchain build in the Makefile is
      # what keeps this passing -- and keeps CI identical to `make lint` locally.
      - name: golangci-lint
        run: make lint

  codegen:
    name: Generated code is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # A stale CRD or RBAC manifest is a silent deployment bug: the cluster gets a schema that
      # does not match the code. Regenerating and diffing catches it here instead.
      # The API reference is generated from the Go types, so it cannot drift from them.
      - run: make manifests generate api-docs
      - name: Fail if regeneration changed anything
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated files are out of date. Run 'make manifests generate api-docs' and commit the result."
            exit 1
          fi

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests
        run: make test
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: cover.out
          if-no-files-found: warn

  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ghcr.io/vrabbi/patch-operator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  manifests:
    name: Kustomize overlays build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Both overlays must build. The namespaced-only overlay is the recommended install for
      # single-namespace use, so a break in it is a real break.
      - run: make kustomize
      - run: ./bin/kustomize build config/default > /dev/null
      - run: ./bin/kustomize build config/overlays/namespaced-only > /dev/null
