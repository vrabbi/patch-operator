# How a Crossplane XR emits a contributor.
#
# The XR owns the ResourcePatch via the ordinary composed-resource ownerReference.
# That is the whole integration: deletion propagates IN from Crossplane by normal
# garbage collection, and the operator arbitrates what that means for the shared
# target (DESIGN.md 6.3).
#
#   XR --ownerRef--> ResourcePatch --tracked by--> SharedResource --manages--> Ingress
#
# Readiness needs no adapter. ResourcePatch publishes a Crossplane-shaped Ready
# condition, so Crossplane's default readiness check gates the XR on it directly.
# Ready=True means the contribution is applied to every resolved target AND the
# contributor is not party to an unresolved conflict, so an XR never reports ready
# while its ingress rule is stuck behind a field conflict (DESIGN.md 3.1).
#
# Note on authorization: the principal seen at admission here is CROSSPLANE'S
# ServiceAccount, not the user who created the XR, and it is typically close to
# cluster-admin. SubjectAccessReview alone therefore does little to bound a
# Composition author. spec.serviceAccountRef is the real boundary -- it drops the
# write path to a tenant identity that the API server enforces on every write
# (DESIGN.md 7.3, 7.4). Set it in composed patches, and require it if you run
# multi-tenant.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: app-with-shared-ingress
spec:
  compositeTypeRef:
    apiVersion: platform.terasky.com/v1alpha1
    kind: XApp
  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: shared-ingress-contribution
            base:
              apiVersion: terasky.com/v1alpha1
              kind: ResourcePatch
              spec:
                target:
                  mode: Single
                  apiVersion: networking.k8s.io/v1
                  kind: Ingress
                  name: shared-ingress
                  namespace: platform
                lifecycle:
                  onMissing: Create
                  onRelease: Revert
                  adoptExisting: true
                apply:
                  mode: ClientSideApply
                  conflictPolicy: Fail
                priority: 100
                base:
                  apiVersion: networking.k8s.io/v1
                  kind: Ingress
                  metadata:
                    name: shared-ingress
                    namespace: platform
                  spec:
                    ingressClassName: nginx
                patch:
                  type: StrategicMerge
                  mergeKeys:
                    - path: spec.rules
                      key: host
                  value:
                    spec:
                      rules:
                        - host: placeholder
                          http:
                            paths:
                              - path: /
                                pathType: Prefix
                                backend:
                                  service:
                                    name: placeholder
                                    port:
                                      number: 80
            patches:
              # Each XApp contributes exactly one rule, keyed by its own hostname.
              - type: FromCompositeFieldPath
                fromFieldPath: spec.hostname
                toFieldPath: spec.patch.value.spec.rules[0].host
              - type: FromCompositeFieldPath
                fromFieldPath: spec.serviceName
                toFieldPath: spec.patch.value.spec.rules[0].http.paths[0].backend.service.name
              # Impersonate the tenant, so the write carries the tenant's RBAC
              # rather than Crossplane's.
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenant
                toFieldPath: spec.serviceAccountRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-patcher"
