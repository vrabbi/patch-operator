# How a kro ResourceGraphDefinition emits a contributor.
#
# The same integration as Crossplane: the Instance owns the contributor via
# ownerReferences, so deleting the Instance withdraws only that Instance's fields
# from the shared object (DESIGN.md 6.1, A.2).
#
# This is the write-side complement to kro's externalRef. externalRef lets an RGD
# READ a shared resource but never create, update or delete it; a contributor lets
# an Instance CONTRIBUTE to one while the operator reference-counts the
# contributors (DESIGN.md 2). The two compose: externalRef to read fields off the
# shared object, ResourcePatch to write your slice of it.
#
# ============================================================================
# Document 1 emits a namespaced ResourcePatch and is the recommended default: the
# contributor lands in the Instance's namespace and cannot reach outside it,
# whatever kro's ServiceAccount is permitted to do (DESIGN.md 7.0).
#
# Document 2 emits a ClusterResourcePatch for a genuinely cross-namespace target.
# That is a privileged grant -- see the note on it below.
# ============================================================================
---
# Document 1 -- RECOMMENDED. Contained to the Instance's own namespace.
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: app-with-namespaced-shared-ingress
spec:
  schema:
    apiVersion: v1alpha1
    kind: App
    spec:
      name: string
      tenant: string
      hostname: string
      port: integer | default=80
    status:
      ingressReady: ${ingressContribution.status.conditions[?(@.type=="Ready")].status}

  resources:
    - id: service
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: ${schema.spec.name}
        spec:
          selector:
            app: ${schema.spec.name}
          ports:
            - port: ${schema.spec.port}

    - id: ingressContribution
      # Gate downstream resources on the contribution actually landing. Ready is
      # False while a field conflict is unresolved, so nothing downstream proceeds
      # on a half-applied shared object.
      readyWhen:
        - ${ingressContribution.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: terasky.com/v1alpha1
        kind: ResourcePatch
        metadata:
          name: ${schema.spec.name}-ingress-rule
          # namespace is inherited from the Instance. The target resolves in this
          # same namespace, and no other value would be accepted.
        spec:
          target:
            mode: Single
            apiVersion: networking.k8s.io/v1
            kind: Ingress
            name: shared-ingress
          lifecycle:
            onMissing: Create
            onRelease: Revert
            adoptExisting: true
          apply:
            mode: ClientSideApply
            conflictPolicy: Fail
          priority: 100
          serviceAccountRef:
            # Namespaced kind: resolved in this ResourcePatch's own namespace,
            # and the field has no `namespace` sub-field here (DESIGN.md 3.2).
            name: ${schema.spec.tenant}-patcher
          base:
            apiVersion: networking.k8s.io/v1
            kind: Ingress
            metadata:
              name: shared-ingress
            spec:
              ingressClassName: nginx
          patch:
            type: StrategicMerge
            mergeKeys:
              - path: spec.rules
                key: host
            value:
              spec:
                rules:
                  - host: ${schema.spec.hostname}
                    http:
                      paths:
                        - path: /
                          pathType: Prefix
                          backend:
                            service:
                              name: ${schema.spec.name}
                              port:
                                number: ${schema.spec.port}
---
# Document 2 -- PRIVILEGED. A cross-namespace target requires the cluster kind,
# which requires granting kro's ServiceAccount create on clusterresourcepatches.
# Withhold that grant unless a shared platform object genuinely needs per-Instance
# contributions, and set serviceAccountRef when you do (DESIGN.md 7.4).
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: app-with-platform-shared-ingress
spec:
  schema:
    apiVersion: v1alpha1
    kind: PlatformApp
    spec:
      name: string
      tenant: string
      tenantNamespace: string
      hostname: string
      port: integer | default=80
    status:
      ingressReady: ${ingressContribution.status.conditions[?(@.type=="Ready")].status}

  resources:
    - id: ingressContribution
      readyWhen:
        - ${ingressContribution.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: terasky.com/v1alpha1
        kind: ClusterResourcePatch
        metadata:
          name: ${schema.spec.name}-platform-ingress-rule
        spec:
          target:
            mode: Single
            apiVersion: networking.k8s.io/v1
            kind: Ingress
            name: shared-ingress
            namespace: platform
          lifecycle:
            onMissing: Wait
            onRelease: Revert
          apply:
            mode: ClientSideApply
            conflictPolicy: Fail
          priority: 100
          serviceAccountRef:
            name: ${schema.spec.tenant}-patcher
            namespace: ${schema.spec.tenantNamespace}
          patch:
            type: StrategicMerge
            mergeKeys:
              - path: spec.rules
                key: host
            value:
              spec:
                rules:
                  - host: ${schema.spec.hostname}
                    http:
                      paths:
                        - path: /
                          pathType: Prefix
                          backend:
                            service:
                              name: ${schema.spec.name}
                              port:
                                number: ${schema.spec.port}
